_type: cloud
name: Development
region: us

replication:
  connections:
    - type: mongodb
      uri: mongodb+srv://voicechecklist.0hbva2h.mongodb.net/voice_checklist_dev?authSource=admin
      username: voice_checklist_sync_dev
      password:
        secret: !env GH29_ATLAS_SYNC_PASSWORD
      database: voice_checklist_dev
